<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="icon" href="logo/talala-logo.svg" type="image/svg+xml">
    <title>تعيين كلمة مرور جديدة | منصة طلاقة</title>
    <link rel="stylesheet" href="ملفات الموقع/styles.css">
    <link rel="stylesheet" href="ملفات الموقع/assessment.css">
    <link rel="stylesheet" href="ملفات الموقع/theme.css">
    <style>
        #update-password-form[hidden],
        #login-link[hidden],
        #permission-summary[hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="logo/talala-logo.svg" alt="">
            <span class="brand-name"><span class="brand-title">منصة طلاقة</span><span class="brand-badge">بوابة المعلم/ة</span></span>
        </a>
        <nav aria-label="التنقل الرئيسي">
            <ul><li><a href="index.html">الرئيسية</a></li><li><a href="support.html">الدعم</a></li></ul>
        </nav>
    </header>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="password-title">
            <h1 id="password-title">تعيين كلمة مرور جديدة</h1>
            <p id="recovery-status" class="login-error" role="status" aria-live="polite">جارٍ التحقق من رابط الاستعادة...</p>
            <form id="update-password-form" hidden>
                <label for="new-password">كلمة المرور الجديدة <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                <label for="confirm-password">تأكيد كلمة المرور <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                <button type="submit" class="primary-button">حفظ كلمة المرور</button>
            </form>
            <section id="permission-summary" class="local-storage-note" aria-labelledby="permission-title" hidden>
                <strong id="permission-title">الصلاحيات المرتبطة بحسابك</strong>
                <ul id="assigned-permissions"></ul>
                <p>تغيير كلمة المرور لا يغيّر هذه الصلاحيات. لطلب تعديلها، تواصل مع مالك المنصة.</p>
            </section>
            <a class="secondary-button" id="login-link" href="teacher-login.html" hidden>العودة إلى تسجيل الدخول</a>
        </section>
    </main>
    <script>
        const recoveryHash = new URLSearchParams(window.location.hash.slice(1));
        const recoveryQuery = new URLSearchParams(window.location.search);
        const recoveryError = recoveryHash.get('error_description')
            || recoveryQuery.get('error_description')
            || recoveryHash.get('error')
            || recoveryQuery.get('error');
        if (
            recoveryHash.get('type') === 'recovery'
            || recoveryQuery.get('type') === 'recovery'
            || recoveryQuery.has('code')
            || (recoveryQuery.has('token_hash') && recoveryQuery.get('type') === 'recovery')
        ) {
            sessionStorage.setItem('talalaPasswordRecoveryLink', 'true');
            sessionStorage.removeItem('talalaPasswordRecoveryError');
        }
        if (recoveryError) {
            sessionStorage.setItem('talalaPasswordRecoveryError', recoveryError);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="supabase/config.js"></script>
    <script src="supabase/client.js"></script>
    <script>
        const form = document.querySelector('#update-password-form');
        const status = document.querySelector('#recovery-status');
        const loginLink = document.querySelector('#login-link');
        const permissionSummary = document.querySelector('#permission-summary');
        const assignedPermissions = document.querySelector('#assigned-permissions');
        const newPassword = document.querySelector('#new-password');
        const confirmPassword = document.querySelector('#confirm-password');
        let recoverySessionReady = sessionStorage.getItem('talalaPasswordRecoveryLink') === 'true';
        let recoveryEventReceived = false;
        const permissionLabels = {
            reports: 'عرض التقارير',
            analytics: 'تحليلات المدرسة',
            questions: 'إدارة وتعديل الأسئلة',
            interventions: 'تعديل التدخل والشرح',
            support: 'إدارة الدعم والمساندة'
        };

        async function showRecoveryForm(session) {
            status.className = 'local-storage-note';
            status.setAttribute('role', 'status');
            status.textContent = 'جارٍ تحميل الصلاحيات المرتبطة بحسابك...';
            const { data, error } = await window.TalalaBackend.requireClient()
                .from('profiles')
                .select('permissions')
                .eq('id', session.user.id)
                .single();
            if (error) throw error;
            assignedPermissions.replaceChildren();
            const permissions = Array.isArray(data.permissions) ? data.permissions : [];
            const labels = permissions.map((permission) => permissionLabels[permission]).filter(Boolean);
            (labels.length ? labels : ['لا توجد صلاحيات إضافية مخصصة لهذا الحساب.']).forEach((label) => {
                const item = document.createElement('li');
                item.textContent = label;
                assignedPermissions.append(item);
            });
            permissionSummary.hidden = false;
            form.hidden = false;
            status.textContent = 'أدخل كلمة مرور جديدة لا تقل عن 8 أحرف.';
        }

        if (!window.TalalaBackend.isConfigured) {
            status.textContent = window.TalalaBackend.configurationMessage;
            status.setAttribute('role', 'alert');
        } else {
            const supabase = window.TalalaBackend.requireClient();
            const recoveryType = recoveryHash.get('type') || recoveryQuery.get('type');
            const recoveryTokenHash = recoveryQuery.get('token_hash');
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY' && session) {
                    recoveryEventReceived = true;
                    recoverySessionReady = true;
                    sessionStorage.setItem('talalaPasswordRecoveryLink', 'true');
                }
            });

            (async () => {
                if (recoveryTokenHash && recoveryType === 'recovery') {
                    const { error } = await supabase.auth.verifyOtp({
                        token_hash: recoveryTokenHash,
                        type: 'recovery'
                    });
                    if (error) throw error;
                    recoverySessionReady = true;
                    sessionStorage.setItem('talalaPasswordRecoveryLink', 'true');
                }

                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                const recoveryError = sessionStorage.getItem('talalaPasswordRecoveryError');
                if (recoveryError) throw new Error(recoveryError);
                if (data.session && (recoverySessionReady || recoveryEventReceived)) {
                    await showRecoveryForm(data.session);
                    return;
                }
                sessionStorage.removeItem('talalaPasswordRecoveryLink');
                status.textContent = 'رابط الاستعادة غير صالح أو منتهي الصلاحية. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.';
                status.setAttribute('role', 'alert');
                loginLink.hidden = false;
            })().catch((error) => {
                console.error('Unable to verify the password recovery session.', error);
                status.textContent = `تعذر التحقق من رابط الاستعادة: ${error.message}`;
                status.setAttribute('role', 'alert');
                loginLink.hidden = false;
            });
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            status.setAttribute('role', 'alert');
            if (!form.reportValidity()) return;
            if (newPassword.value !== confirmPassword.value) {
                status.textContent = 'كلمتا المرور غير متطابقتين.';
                confirmPassword.focus();
                return;
            }

            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            status.textContent = 'جارٍ تحديث كلمة المرور...';
            try {
                const supabase = window.TalalaBackend.requireClient();
                const { error } = await supabase.auth.updateUser({ password: newPassword.value });
                if (error) throw error;

                form.hidden = true;
                loginLink.hidden = false;
                status.className = 'local-storage-note';
                status.setAttribute('role', 'status');
                status.textContent = 'تم تحديث كلمة المرور. جارٍ إنهاء جلسة الاستعادة...';
                const { error: signOutError } = await supabase.auth.signOut();
                sessionStorage.removeItem('talalaPasswordRecoveryLink');
                sessionStorage.removeItem('talalaPasswordRecoveryError');
                if (signOutError) {
                    console.error('Unable to sign out after password recovery.', signOutError);
                    status.textContent = 'تم تحديث كلمة المرور. استخدمها لتسجيل الدخول، وإذا بقيت الجلسة مفتوحة فسجّل الخروج يدويًا.';
                    return;
                }
                status.textContent = 'تم تحديث كلمة المرور. يمكنك الآن تسجيل الدخول بها.';
            } catch (error) {
                console.error('Unable to update the password.', error);
                status.textContent = `تعذر تحديث كلمة المرور: ${error.message}`;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
