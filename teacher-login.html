<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="icon" href="logo/talala-logo.svg" type="image/svg+xml">
    <title>دخول المعلم/ة | منصة طلاقة</title>
    <link rel="stylesheet" href="ملفات الموقع/styles.css">
    <link rel="stylesheet" href="ملفات الموقع/assessment.css">
    <link rel="stylesheet" href="ملفات الموقع/theme.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="logo/talala-logo.svg" alt="">
            <span class="brand-name"><span class="brand-title">منصة طلاقة</span><span class="brand-badge">بوابة المعلم/ة</span></span>
        </a>
        <nav aria-label="التنقل الرئيسي">
            <ul><li><a href="index.html">الرئيسية</a></li></ul>
        </nav>
    </header>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">دخول المعلم/ة</h1>
            <form id="teacher-login-form">
                <label for="username">البريد الإلكتروني المستخدم للتسجيل <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="username" name="username" type="email" autocomplete="username" required>
                <label for="password">كلمة المرور <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="button" class="forgot" id="forgot-password">نسيت كلمة المرور؟</button>
                <p class="login-error" id="login-error" role="alert"></p>
                <button type="submit" class="primary-button">دخول</button>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="supabase/config.js"></script>
    <script src="supabase/client.js"></script>
    <script>
        const form = document.querySelector('#teacher-login-form');
        const error = document.querySelector('#login-error');
        const username = document.querySelector('#username');
        const password = document.querySelector('#password');
        const submitButton = form.querySelector('button[type="submit"]');

        function errorCode(error) {
            return typeof error?.code === 'string' && /^[a-z0-9_-]+$/i.test(error.code)
                ? error.code
                : '';
        }

        function getAccessDenialReason(profile) {
            if (!profile) return 'لم يُعثر على ملف صلاحيات مرتبط بحساب الدخول.';
            if (profile.active !== true) return 'حالة الحساب في ملف الصلاحيات ليست مفعّلة.';
            if (!['owner', 'teacher', 'school_manager'].includes(profile.role)) {
                return `الدور المسجل (${profile.role || 'غير محدد'}) لا يملك دخول البوابة.`;
            }
            if (profile.role === 'owner') return 'تعذر التحقق من صلاحية المالك؛ راجع مسؤول المنصة.';
            if (profile.invitation_accepted !== true) return 'لم تُقبل دعوة هذا الحساب بعد.';
            const hasTeacherPermission = Array.isArray(profile.permissions)
                && ['reports', 'analytics', 'questions', 'interventions', 'support']
                    .some((permission) => profile.permissions.includes(permission));
            if (!hasTeacherPermission && !profile.permissions?.includes('manage_teachers')) {
                return 'لا توجد صلاحية بوابة مناسبة في ملف هذا الحساب.';
            }
            return 'تعذر التحقق من صلاحية الحساب؛ حاول مجددًا أو تواصل مع مسؤول المنصة.';
        }

        if (!window.TalalaBackend.isConfigured) {
            error.textContent = 'تعذر تسجيل الدخول حاليًا. يرجى المحاولة لاحقًا.';
            submitButton.disabled = true;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            error.textContent = '';
            submitButton.disabled = true;
            try {
                const supabase = window.TalalaBackend.requireClient();
                const { error: signInError } = await supabase.auth.signInWithPassword({
                    email: username.value.trim(),
                    password: password.value
                });
                if (signInError) {
                    console.error('Password authentication failed.', signInError);
                    if (signInError.code === 'invalid_credentials') {
                        error.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                    } else if (signInError.code === 'email_not_confirmed') {
                        error.textContent = 'يجب تأكيد البريد الإلكتروني قبل تسجيل الدخول.';
                    } else {
                        const code = errorCode(signInError);
                        error.textContent = `تعذر إكمال تسجيل الدخول بسبب مشكلة في خدمة المصادقة.${code ? ` رمز الخطأ: ${code}.` : ''}`;
                    }
                    return;
                }

                let profile;
                try {
                    profile = await window.TalalaBackend.getProfile();
                } catch (profileError) {
                    const { error: signOutError } = await supabase.auth.signOut();
                    if (signOutError) console.error('Unable to clear an unverified login session.', signOutError);
                    console.error('Password authentication succeeded, but profile lookup failed.', profileError);
                    const code = errorCode(profileError);
                    error.textContent = `تم التحقق من كلمة المرور، لكن تعذر تحميل صلاحيات الحساب. لم يكتمل الدخول.${code ? ` رمز الخطأ: ${code}.` : ''}`;
                    return;
                }

                const isOwner = profile?.role === 'owner';
                const teacherHasPermission = Array.isArray(profile?.permissions)
                    && ['reports', 'analytics', 'questions', 'interventions', 'support']
                        .some((permission) => profile.permissions.includes(permission));
                const allowed = !!profile
                    && profile.active === true
                    && ['owner', 'teacher', 'school_manager'].includes(profile.role)
                    && (isOwner || profile.invitation_accepted === true)
                    && (isOwner || teacherHasPermission || profile.permissions?.includes('manage_teachers'));
                if (!allowed) {
                    const denialReason = getAccessDenialReason(profile);
                    console.error('Profile failed teacher portal access checks.', {
                        role: profile?.role ?? null,
                        active: profile?.active ?? null,
                        invitationAccepted: profile?.invitation_accepted ?? null,
                        permissions: Array.isArray(profile?.permissions) ? profile.permissions : null
                    });
                    const { error: signOutError } = await supabase.auth.signOut();
                    if (signOutError) console.error('Unable to sign out an unauthorized account.', signOutError);
                    error.textContent = `تم التحقق من كلمة المرور، لكن ${denialReason}`;
                    return;
                }
                window.location.replace('question-manager.html');
            } catch (requestError) {
                console.error('Unable to complete password sign-in.', requestError);
                const code = errorCode(requestError);
                error.textContent = `تعذر الاتصال بخدمة تسجيل الدخول. تحقق من اتصالك وحاول مجددًا.${code ? ` رمز الخطأ: ${code}.` : ''}`;
            } finally {
                submitButton.disabled = !window.TalalaBackend.isConfigured;
            }
        });

        const forgotPasswordButton = document.querySelector('#forgot-password');
        forgotPasswordButton.addEventListener('click', async () => {
            error.textContent = '';
            if (!username.value.trim()) {
                error.textContent = 'أدخل بريدك الإلكتروني أولًا.';
                return;
            }

            forgotPasswordButton.disabled = true;
            try {
                const supabase = window.TalalaBackend.requireClient();
                const redirectTo = new URL('update-password.html', window.location.href).toString();
                const { error: resetError } = await supabase.auth.resetPasswordForEmail(username.value.trim(), {
                    redirectTo
                });
                if (resetError) throw resetError;
                error.textContent = 'إذا كان البريد مسجلًا، ستصلك رسالة لإعادة تعيين كلمة المرور.';
            } catch (resetError) {
                console.error('Unable to send a password reset email.', resetError);
                error.textContent = 'تعذر إرسال رسالة إعادة التعيين. يرجى المحاولة لاحقًا.';
            } finally {
                forgotPasswordButton.disabled = false;
            }
        });
    </script>
</body>
</html>
