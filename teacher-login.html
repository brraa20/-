<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="icon" href="logo/talala-logo.svg" type="image/svg+xml">
    <title>دخول المعلم/ة | منصة طلاقة</title>
    <link rel="stylesheet" href="ملفات الموقع/styles.css">
    <link rel="stylesheet" href="ملفات الموقع/assessment.css">
    <link rel="stylesheet" href="ملفات الموقع/theme.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="logo/talala-logo.svg" alt="">
            <span class="brand-name"><span class="brand-title">منصة طلاقة</span><span class="brand-badge">بوابة المعلم/ة</span></span>
        </a>
        <nav aria-label="التنقل الرئيسي">
            <ul><li><a href="index.html">الرئيسية</a></li><li><a href="support.html">الدعم</a></li></ul>
        </nav>
    </header>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">دخول المعلم/ة</h1>
            <p class="local-storage-note">نسخة تجريبية: البيانات محفوظة على هذا الجهاز فقط.</p>
            <form id="teacher-login-form">
                <label for="username">اسم المستخدم <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="username" name="username" autocomplete="username" required>
                <label for="password">كلمة المرور <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="button" class="forgot" id="forgot-password">نسيت كلمة المرور؟</button>
                <p class="login-error" id="login-error" role="alert"></p>
                <button type="submit" class="primary-button">دخول</button>
            </form>
        </section>
    </main>
    <script>
        const form = document.querySelector('#teacher-login-form');
        const error = document.querySelector('#login-error');
        const username = document.querySelector('#username');
        const password = document.querySelector('#password');

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            let ownerAccount;
            let extraAccounts;
            try {
                ownerAccount = JSON.parse(localStorage.getItem('talalaTeacherAccount') || 'null')
                    || { name: 'HANAA', username: 'HANAA', password: '11887799' };
                extraAccounts = JSON.parse(localStorage.getItem('talalaTeacherAccounts') || '[]');
                if (!Array.isArray(extraAccounts)) throw new Error('Stored teacher accounts must be a list.');
            } catch (storageError) {
                error.textContent = 'تعذر قراءة الحسابات المحفوظة. يرجى مراجعة بيانات المتصفح.';
                console.error('Unable to read teacher accounts from local storage.', storageError);
                return;
            }
            const canSignIn = username.value.trim() === ownerAccount.username && password.value === ownerAccount.password;
            const matchingTeacher = extraAccounts.find((teacher) => teacher.authorized !== false
                && teacher.username === username.value.trim()
                && teacher.password === password.value);
            if (canSignIn || matchingTeacher) {
                sessionStorage.setItem('talalaTeacherSession', 'authenticated');
                sessionStorage.setItem('talalaTeacherRole', canSignIn ? 'owner' : 'teacher');
                sessionStorage.setItem('talalaTeacherPermissions', JSON.stringify(canSignIn
                    ? ['reports', 'analytics', 'questions', 'interventions', 'support', 'permissions']
                    : Array.isArray(matchingTeacher.permissions) ? matchingTeacher.permissions : []));
                sessionStorage.setItem('talalaTeacherName', canSignIn ? ownerAccount.name : matchingTeacher.name);
                window.location.href = 'question-manager.html';
                return;
            }
            error.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
        });

        document.querySelector('#forgot-password').addEventListener('click', () => {
            error.textContent = 'تواصل مع مالك المنصة لإعادة تعيين الحساب.';
        });
    </script>
</body>
</html>
