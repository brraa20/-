<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">
    <meta name="description" content="الصفحة التي طلبتها غير موجودة في منصة طلاقة.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>الصفحة غير موجودة | منصة طلاقة</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f7f3;
            color: #23352a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 620px);
            padding: clamp(28px, 7vw, 56px);
            border: 1px solid #dce8dd;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 50px #173a2414;
            text-align: center;
        }

        .brand {
            color: #176b45;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .code {
            margin: 24px 0 8px;
            color: #176b45;
            font-size: clamp(4rem, 18vw, 7rem);
            font-weight: 800;
            line-height: 1;
        }

        h1 {
            margin: 16px 0 12px;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }

        p {
            margin: 0 auto;
            max-width: 42ch;
            color: #5b6b60;
            line-height: 1.8;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 28px;
        }

        a {
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border: 2px solid #176b45;
            border-radius: 12px;
            color: #176b45;
            font-weight: 700;
            text-decoration: none;
        }

        a:first-child {
            background: #176b45;
            color: #fff;
        }

        a:hover {
            filter: brightness(.92);
        }

        a:focus-visible {
            outline: 3px solid #d08a32;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">منصة طلاقة</div>
        <div class="code" aria-hidden="true">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p>قد يكون الرابط غير صحيح أو أن الصفحة نُقلت. يمكنك العودة إلى الرئيسية أو فتح صفحة دخول المعلم/ة.</p>
        <nav aria-label="روابط مقترحة">
            <a href="index.html">العودة إلى الرئيسية</a>
            <a href="teacher-login.html">دخول المعلم/ة</a>
        </nav>
    </main>
</body>
</html>
