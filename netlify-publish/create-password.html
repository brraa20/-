<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="icon" href="talala-logo.svg" type="image/svg+xml">
    <title>إنشاء كلمة مرور الحساب | منصة طلاقة</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="assessment.css">
    <link rel="stylesheet" href="theme.css">
    <style>
        #create-password-form[hidden],
        #login-link[hidden],
        #permission-summary[hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="talala-logo.svg" alt="">
            <span class="brand-name"><span class="brand-title">منصة طلاقة</span><span class="brand-badge">بوابة المعلم/ة</span></span>
        </a>
        <nav aria-label="التنقل الرئيسي">
            <ul><li><a href="index.html">الرئيسية</a></li><li><a href="support.html">الدعم</a></li></ul>
        </nav>
    </header>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="create-password-title">
            <h1 id="create-password-title">إنشاء كلمة مرور الحساب</h1>
            <p id="invitation-status" class="login-error" role="status" aria-live="polite">جارٍ التحقق من رابط الدعوة...</p>
            <form id="create-password-form" hidden>
                <label for="new-password">كلمة المرور الخاصة بك <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                <label for="confirm-password">تأكيد كلمة المرور <span class="required-mark" aria-hidden="true">*</span></label>
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                <button type="submit" class="primary-button">إنشاء كلمة المرور</button>
            </form>
            <section id="permission-summary" class="local-storage-note" aria-labelledby="permission-title" hidden>
                <strong id="permission-title">الصلاحيات التي خصصها مالك المنصة لحسابك</strong>
                <ul id="assigned-permissions"></ul>
                <p>تغيير كلمة المرور لا يغيّر هذه الصلاحيات. لطلب تعديلها، تواصل مع مالك المنصة.</p>
            </section>
            <a class="secondary-button" id="login-link" href="teacher-login.html" hidden>العودة إلى تسجيل الدخول</a>
        </section>
    </main>
    <script>
        const invitationHash = new URLSearchParams(window.location.hash.slice(1));
        const invitationQuery = new URLSearchParams(window.location.search);
        const invitationError = invitationHash.get('error_description')
            || invitationQuery.get('error_description')
            || invitationHash.get('error')
            || invitationQuery.get('error');
        const hasInvitation = invitationHash.get('type') === 'invite'
            || invitationQuery.get('type') === 'invite'
            || Boolean(invitationQuery.get('code'));
        if (hasInvitation) {
            sessionStorage.setItem('talalaTeacherInvitation', 'true');
            sessionStorage.removeItem('talalaTeacherInvitationError');
        }
        if (invitationError) {
            sessionStorage.setItem('talalaTeacherInvitationError', invitationError);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="supabase/config.js"></script>
    <script src="supabase/client.js"></script>
    <script>
        const form = document.querySelector('#create-password-form');
        const status = document.querySelector('#invitation-status');
        const loginLink = document.querySelector('#login-link');
        const permissionSummary = document.querySelector('#permission-summary');
        const assignedPermissions = document.querySelector('#assigned-permissions');
        const newPassword = document.querySelector('#new-password');
        const confirmPassword = document.querySelector('#confirm-password');
        let invitationSessionReady = sessionStorage.getItem('talalaTeacherInvitation') === 'true';
        const permissionLabels = {
            reports: 'عرض التقارير',
            analytics: 'تحليلات المدرسة',
            questions: 'إدارة وتعديل الأسئلة',
            interventions: 'تعديل التدخل والشرح',
            support: 'إدارة الدعم والمساندة'
        };

        async function showPasswordForm(session) {
            status.className = 'local-storage-note';
            status.setAttribute('role', 'status');
            status.textContent = 'جارٍ تحميل الصلاحيات المخصصة لحسابك...';
            const { data, error } = await window.TalalaBackend.requireClient()
                .from('profiles')
                .select('permissions')
                .eq('id', session.user.id)
                .single();
            if (error) throw error;
            assignedPermissions.replaceChildren();
            const permissions = Array.isArray(data.permissions) ? data.permissions : [];
            const labels = permissions.map((permission) => permissionLabels[permission]).filter(Boolean);
            (labels.length ? labels : ['لا توجد صلاحيات إضافية مخصصة لهذا الحساب.']).forEach((label) => {
                const item = document.createElement('li');
                item.textContent = label;
                assignedPermissions.append(item);
            });
            permissionSummary.hidden = false;
            form.hidden = false;
            status.textContent = 'أنشئ كلمة مرور خاصة بك لا تقل عن 8 أحرف، ثم استخدم بريد الدعوة وكلمة المرور لتسجيل الدخول.';
        }

        if (!window.TalalaBackend.isConfigured) {
            status.textContent = window.TalalaBackend.configurationMessage;
            status.setAttribute('role', 'alert');
        } else {
            const supabase = window.TalalaBackend.requireClient();
            const invitationType = invitationHash.get('type') || invitationQuery.get('type');
            const invitationTokenHash = invitationQuery.get('token_hash');
            (async () => {
                if (invitationTokenHash && invitationType === 'invite') {
                    const { error } = await supabase.auth.verifyOtp({
                        token_hash: invitationTokenHash,
                        type: 'invite'
                    });
                    if (error) throw error;
                    invitationSessionReady = true;
                    sessionStorage.setItem('talalaTeacherInvitation', 'true');
                }

                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                const invitationError = sessionStorage.getItem('talalaTeacherInvitationError');
                if (invitationError) throw new Error(invitationError);
                if (data.session && invitationSessionReady) {
                    await showPasswordForm(data.session);
                    return;
                }
                sessionStorage.removeItem('talalaTeacherInvitation');
                status.textContent = 'رابط الدعوة غير صالح أو منتهي الصلاحية. اطلب من مالك المنصة إرسال دعوة جديدة.';
                status.setAttribute('role', 'alert');
                loginLink.hidden = false;
            })().catch((error) => {
                console.error('Unable to verify the teacher invitation.', error);
                status.textContent = `تعذر التحقق من رابط الدعوة: ${error.message}`;
                status.setAttribute('role', 'alert');
                loginLink.hidden = false;
            });
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!form.reportValidity()) return;
            if (newPassword.value !== confirmPassword.value) {
                status.textContent = 'كلمتا المرور غير متطابقتين.';
                status.setAttribute('role', 'alert');
                confirmPassword.focus();
                return;
            }

            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            status.textContent = 'جارٍ إنشاء كلمة المرور...';
            status.setAttribute('role', 'status');
            try {
                const supabase = window.TalalaBackend.requireClient();
                const { error } = await supabase.auth.updateUser({ password: newPassword.value });
                if (error) throw error;

                form.hidden = true;
                loginLink.hidden = false;
                sessionStorage.removeItem('talalaTeacherInvitation');
                sessionStorage.removeItem('talalaTeacherInvitationError');
                status.className = 'local-storage-note';
                status.textContent = 'تم إنشاء كلمة المرور. يمكنك الآن تسجيل الدخول ببريد الدعوة وكلمة المرور الجديدة.';
                const { error: signOutError } = await supabase.auth.signOut();
                if (signOutError) {
                    console.error('Unable to sign out after accepting the teacher invitation.', signOutError);
                    status.textContent = 'تم إنشاء كلمة المرور. استخدمها لتسجيل الدخول، وسجّل الخروج يدويًا إذا بقيت الجلسة مفتوحة.';
                }
            } catch (error) {
                console.error('Unable to create the teacher password.', error);
                status.textContent = `تعذر إنشاء كلمة المرور: ${error.message}`;
                status.setAttribute('role', 'alert');
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
